<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit proposal — RootMC Governance</title>
  <link rel="stylesheet" href="/styles/rootmc.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="canonical" href="https://rootmc.net/governance/submit/">
</head>
<body>
  <header class="rmc-header">
    <div class="container rmc-header-inner">
      <a class="rmc-brand" href="/"><span class="rmc-brand-mark">R</span>RootMC</a>
      <nav class="rmc-nav"><a href="/council/">Council</a><a href="/verify/" class="rmc-nav-cta">Link account</a></nav>
    </div>
  </header>
  <main class="container" style="padding-bottom:3rem;max-width:640px;">
    <p class="wiki-breadcrumb"><a href="/council/">Council</a> · Submit</p>
    <p class="rmc-muted">Eligible linked players · discuss in the Discord thread · compiled into the weekly bill each <strong>Sunday (HST)</strong> if published at least <strong>3 days</strong> earlier.</p>
    <div id="gov-me"></div>
    <form id="form-submit" class="rmc-card verify-form">
      <label class="verify-field"><span>Title</span><input name="title" maxlength="200" required></label>
      <label class="verify-field"><span>Category</span>
        <select name="category" required>
          <option value="governance">Governance body</option>
          <option value="constitution">Constitution</option>
          <option value="plugin">Plugin / server rules</option>
          <option value="metric">Server metric / policy</option>
        </select>
      </label>
      <label class="verify-field"><span>Description</span><textarea name="description" rows="10" maxlength="4000" required></textarea></label>
      <p class="rmc-muted" style="font-size:.9rem;">By submitting you confirm linked Discord verification and acceptance of the <a href="/terms/">Terms of Service</a>.</p>
      <button type="submit" class="rmc-btn rmc-btn-primary" id="btn-submit">Submit proposal</button>
      <p id="status" class="verify-status" role="status" hidden></p>
    </form>
  </main>
  <script src="/governance/governance.js"></script>
  <script>
    (async function () {
      const G = window.RootMcGovernance;
      const me = await G.loadMe();
      G.renderStatusBanner(me, G.el("gov-me"));
      const form = G.el("form-submit");
      const status = G.el("status");
      const btn = G.el("btn-submit");

      if (!me || !me.signed_in || !me.linked || !me.eligible || !me.terms_accepted) {
        btn.disabled = true;
      }

      form.addEventListener("submit", async function (ev) {
        ev.preventDefault();
        const fd = new FormData(form);
        status.hidden = false;
        status.className = "verify-status verify-status-info";
        status.textContent = "Submitting…";
        const res = await G.govFetch("proposals", {
          method: "POST",
          body: JSON.stringify({
            title: fd.get("title"),
            description: fd.get("description"),
            category: fd.get("category"),
          }),
        });
        if (res.ok && res.data.ok) {
          status.className = "verify-status verify-status-info";
          status.textContent = "Submitted! Redirecting…";
          window.location.href = res.data.url || "/governance/proposals/";
        } else {
          status.className = "verify-status verify-status-err";
          status.textContent = (res.data && res.data.detail) || "Submit failed.";
        }
      });
    })();
  </script>
</body>
</html>
